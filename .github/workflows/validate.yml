name: Site validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      SEANBETTS_IMAGE_CACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Image pipeline regression tests
        run: node --test scripts/tests/*.test.cjs
      - name: React tests
        run: npm test -- --watchAll=false --runInBand
      - name: Production build, crawl and image checks
        run: npm run build
